services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: lingua, POSTGRES_PASSWORD: lingua, POSTGRES_DB: lingua }
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment: { DATABASE_URL: "postgresql+psycopg://lingua:lingua@db:5432/lingua" }
    ports: ["8000:8000"]
    depends_on: [db]
volumes: { pgdata: {} }
